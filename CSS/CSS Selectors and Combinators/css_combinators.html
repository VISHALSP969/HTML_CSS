<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div span{
            color: red;
        }
        ul>li{
            color: blue;
        }
        h2+p{
            color: green;
        }
        h2~p{
            color: navy;
        }
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <p>Explore Now!</p>
    <p>Thank you</p>
    <div>
        This is <span>sample <span>text</span></span> used for <span>descendant selector</span>.
    </div>
    <h2>Fruits</h2>
    <p>Some of the fruits are:</p>
    <ul>
        <li>
            <ul>
                <li>Apple</li>
                <li>Pine apple</li>
            </ul>
        </li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
    <h2>Vegetables</h2>
    <p>Tomato</p>
    <p>Potato</p>
</body>
</html>
