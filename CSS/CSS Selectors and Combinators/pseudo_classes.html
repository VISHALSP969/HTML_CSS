<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: red;
        }
        h1:hover{
            color: blue;
        }
        li:nth-child(odd){
            color: green;
        }
        li:nth-child(even){
            color: brown;
        }
        p:first-child{
            color: violet;
        }
        p:last-child{
            color: chartreuse;
        }
        li:first-child{
            color: red;
        }
        li:last-child{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
    <div>
        <p>Welcome to Home</p>
        <p>Explore Now!</p>
        <p>Thank You!</p>
    </div>
    <p>Vegetables</p>
    <ol>
        <li>Tomato</li>
        <li>Potato</li>
        <li>Onion</li>
        <li>Brinjal</li>
        <li>Cucumber</li>
        <li>Pumkin</li>
    </ol>
</body>
</html>
