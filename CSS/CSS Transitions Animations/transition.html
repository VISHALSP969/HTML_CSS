<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            transition: bacckground-color 250ms ease, transform 250ms cubic-bezier(.2,.8,.2,1);
            cursor: pointer;
        }
        .btn:hover{
            background-color: #2563eb;
            transform: translateY(-3px) scale(1.02);
        }
    </style>
</head>
<body>
    <button class="btn">Click</button>
</body>
</html>
