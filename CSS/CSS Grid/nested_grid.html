<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer-grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    </style>
</head>
<body>
    <div class="outer-grid">
        <div class="nested">
            <div>Nested 1</div>
            <div>Nested 2</div>
        </div>
        <div>Outer 2</div>
    </div>
</body>
</html>
