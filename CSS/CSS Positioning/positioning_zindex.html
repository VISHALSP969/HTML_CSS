<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            height: 200px;
            background: #eee;
        }
        .box1{
            position: absolute;
            top: 20px;
            left: 20px;
            background: red;
            color: white;
            padding: 10px;
            z-index: 2;
        }
        .box2{
            position: absolute;
            top: 40px;
            left: 40px;
            background: blue;
            columns: white;
            padding: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box 1(z-index:2)</div>
        <div class="box2">Box 2(z-index:1)</div>
    </div>
</body>
</html>
