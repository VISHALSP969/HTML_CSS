<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: navy;
        }
        .highlight{
            background-color: yellow;
        }
        #main-text{
            font-weight: bold;
            font-style: italic;
        }
        *{
            margin: 5px;
            padding: 20px;
        }
        h2,h3{
            color: green;
        }
        div p{
            color: red;
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <h2>Welcome to Home.</h2>
    <h3>Hope you are doing well!</h3>
    <p class="highlight">This is highlighted text.</p>
    <p id="main-text">This is main text.</p>
    <div>
        <p>Thanks for visit.</p>
    </div>
</body>
</html>
