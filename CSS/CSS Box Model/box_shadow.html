<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            margin-bottom: 50px;
            border: 2px solid black;
            background-color: coral;
        }
        .box1{
            box-shadow: 5px 5px;
        }
        .box2{
            box-shadow: 5px 5px yellow;
        }
        .box3{
            box-shadow: 5px 5px 10px brown;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
