<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin-bottom: 20px;
            background-color: chartreuse;
        }
        .box1{
            border-radius: 15px;
        }
        .box2{
            border-radius: 10px 0 10px 0;
        }
        .box3{
            border-radius: 0 10px;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
