<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            width: 60%;
            margin: 20px 0;
        }
        th,td{
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th{
            background-color: #f2f2f2;
        }
        tr:nth-child(even){
            background-color: lightslategray;
        }
        tr:hover{
            background-color: #d1e0e0;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>$1000</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>$25</td>
            <td>150</td>
        </tr>
    </table>
</body>
</html>
