<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="registration.php" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" name="fullname" id="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required><br><br>

        <label for="pass">Password:</label>
        <input type="password" name="passwor" id="pass" required><br><br>

        <label for="">Gender:</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female<br><br>

        <label for="hobbies">Hobbies:</label><br>
        <input type="checkbox" name="hobby" value="reading">Reading
        <input type="checkbox" name="hobby" value="sports">Sports<br><br>

        <label for="country">Country:</label><br>
        <select name="country" id="country">
            <option value="in">India</option>
            <option value="us">USA</option>
            <option value="uk">UK</option>
        </select><br><br>

        <label for="bio">About you:</label><br>
        <textarea name="bio" id="bio" rows="4" cols="40" placeholder="Write something..."></textarea><br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" name="photo"><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
